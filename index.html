    <button data-view="products">Produits</button>

    <div class="link sync" id="link"><i></i><div><b></b><small></small></div></div>

  </div>

<main>
  <header class="top"><h1 id="title"></h1><div id="actions"></div></header>

<script>
'use strict';
/* Planète 2 — Gestion de stock (parfumerie). Données stockées dans le navigateur (localStorage). */
const KEY = 'planete2.v1';
const CATS = ['Eau de parfum', 'Eau de toilette', 'Extrait', 'Brume', 'Huile / Oud', 'Coffret', 'Autre'];
const $ = (s, r = document) => r.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fcfa = n => new Intl.NumberFormat('fr-FR').format(Math.round(n || 0)) + ' FCFA';
const dateFr = d => new Date(d).toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric' });
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now() + Math.random().toString(16).slice(2));
const today = () => new Date().toISOString().slice(0, 10);

let db = load(), view = 'dashboard', q = '', fcat = '', ftype = '', sper = 'month', ofilt = 'pending';

function load() {
  try { const d = JSON.parse(localStorage.getItem(KEY)); if (d && Array.isArray(d.products) && Array.isArray(d.moves)) return norm(d); } catch (e) {}
  return { products: [], moves: [], sales: [], cash: [], orders: [], cap: [] };
}
function norm(d) { // adapte les anciennes données au fonctionnement actuel
  if (!Array.isArray(d.sales)) d.sales = [];
  if (!Array.isArray(d.cash)) d.cash = [];
  if (!Array.isArray(d.orders)) d.orders = [];
  if (!Array.isArray(d.cap)) d.cap = [];
  d.moves.forEach(m => { if (m.type === 'out' && !m.sale && m.sold === undefined) { m.sold = 0; m.ret = 0; } }); // anciennes sorties : en sortie, prêtes pour Vente ou Retour
  return d;
}
function save() {
  dirty = true; push();
  try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) { toast('Enregistrement impossible : stockage plein ou bloqué'); }
}
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2600); }
const prod = id => db.products.find(p => p.id === id);
const status = p => p.stock <= 0 ? ['out', 'Rupture'] : p.stock <= p.min ? ['low', 'Stock bas'] : ['ok', 'En stock'];
const margin = p => p.cost > 0 ? ((p.price - p.cost) / p.price * 100) : 0;

/* ---------- Rendu ---------- */
const TITLES = { dashboard: 'Tableau de bord', products: 'Produits', sales: 'Ventes', cash: 'Décaissements', orders: 'Commandes fournisseurs', moves: 'Mouvements de stock' };
function render() {
  $('#title').textContent = TITLES[view];
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.view === view));
  const a = $('#actions');
  a.innerHTML = view === 'moves'
    ? '<button class="btn" data-a="in">+ Entrée</button> <button class="btn pri" data-a="out">− Sortie</button>'
    : view === 'sales' ? '<button class="btn pri" data-a="sale">+ Nouvelle vente</button>'
    : view === 'cash' ? '<button class="btn" data-a="cap">+ Ajouter du capital</button> <button class="btn pri" data-a="cash">+ Nouveau décaissement</button>'
    : view === 'orders' ? '<button class="btn pri" data-a="order">+ Nouvelle commande</button>'
    : '<button class="btn" data-a="new">+ Nouveau produit</button> <button class="btn pri" data-a="sale">+ Nouvelle vente</button>';
  $('#view').innerHTML = { dashboard: vDash, products: vProducts, sales: vSales, cash: vCash, orders: vOrders, moves: vMoves }[view]();
  a.insertAdjacentHTML('afterbegin', '<button class="btn" data-a="exp">Exporter PDF / Word</button> ');
  fx();
}

const PAL = ['#c8963e', '#6b4a9a', '#d4688a', '#2f7d5b', '#4a7fb5', '#9a8fb0'];
const BOTTLE = 'M40 8h40v18h-6v10c20 8 32 22 32 44v70a14 14 0 0 1-14 14H28a14 14 0 0 1-14-14V80c0-22 12-36 32-44V26h-6z';
function vDash() {
  const P = db.products;
  if (!P.length) return empty();
  const units = P.reduce((s, p) => s + p.stock, 0);
  const ms = db.sales.filter(x => x.date.startsWith(today().slice(0, 7))), ca = ms.reduce((t, x) => t + x.total, 0), qv = ms.reduce((t, x) => t + saleQty(x), 0), circ = db.moves.reduce((t, m) => t + outRest(m), 0), dm = db.cash.filter(x => x.src !== 'capital' && x.date.startsWith(today().slice(0, 7))).reduce((t, x) => t + x.amount, 0), capD = capIn() - capOut(), pendAmt = db.orders.reduce((t, o) => t + orderRestAmt(o), 0);
  const cost = P.reduce((s, p) => s + p.stock * p.cost, 0);
  const sale = P.reduce((s, p) => s + p.stock * p.price, 0);
  const alerts = P.filter(p => p.stock <= p.min).sort((a, b) => a.stock - b.stock);
  const pct = Math.round((P.length - alerts.length) / P.length * 100);
  const last = [...db.moves].sort((a, b) => b.date.localeCompare(a.date) || b.ts - a.ts).slice(0, 6);
  const byCat = {}; P.forEach(p => byCat[p.cat] = (byCat[p.cat] || 0) + p.stock * p.cost);
  const cats = Object.entries(byCat).sort((a, b) => b[1] - a[1]), tot = cats.reduce((s, c) => s + c[1], 0) || 1;
  let acc = 0;
  const segs = cats.map(([c, v], i) => { const s = v / tot * 100; const r = `<circle class="seg" r="15.9155" cx="21" cy="21" fill="none" stroke="${PAL[i % 6]}" stroke-width="5" stroke-dasharray="${s} ${100 - s}" stroke-dashoffset="${-acc}" style="animation-delay:${i * 120}ms"><title>${esc(c)} : ${fcfa(v)}</title></circle>`; acc += s; return r; }).join('');
  const agg = [...Array(14)].map((_, i) => { const d = new Date(); d.setDate(d.getDate() - 13 + i); return { d: d.toISOString().slice(0, 10), in: 0, out: 0 }; });
  db.moves.forEach(m => { const a = agg.find(x => x.d === m.date); if (a) a[m.type] += m.qty; });
  const mx = Math.max(1, ...agg.flatMap(a => [a.in, a.out]));
  const bars = agg.map((a, i) => { const x = i * 28 + 4, hi = a.in / mx * 100, ho = a.out / mx * 100;
    return `<g><title>${dateFr(a.d)} : +${a.in} / −${a.out}</title><rect class="b-bg" x="${x - 3}" y="0" width="25" height="110" rx="6"/><rect class="b-in" x="${x}" y="${110 - hi}" width="10" height="${hi}" rx="3" style="animation-delay:${i * 45}ms"/><rect class="b-out" x="${x + 11}" y="${110 - ho}" width="10" height="${ho}" rx="3" style="animation-delay:${i * 45 + 25}ms"/></g>`; }).join('');
  return `<div class="hero2">

function fx() {
  const calm = matchMedia('(prefers-reduced-motion:reduce)').matches;
  document.querySelectorAll('[data-count]').forEach(el => {
    const t = +el.dataset.count, f = el.dataset.fmt === 'fcfa' ? fcfa : n => String(Math.round(n));
    if (calm) return;
    const t0 = performance.now();
    (function s(now) { const k = Math.min(1, (now - t0) / 1000); el.textContent = f(t * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(s); })(t0);
  });
  const l = $('.liq');
  if (l) requestAnimationFrame(() => requestAnimationFrame(() => l.style.transform = `translateY(${100 - l.dataset.pct}%)`));
}

function movesTable(list, acts) {
  const st = m => {
    if (m.type !== 'out' || m.sold === undefined) return '';
    const r = outRest(m), det = `${m.sold || 0} vendu(s) · ${m.ret || 0} retourné(s)`;
    return r ? `<span class="badge low">En sortie : ${r}</span><small>${det}</small><div class="acts"><button class="btn sm pri" data-a="sellout" data-id="${m.id}">Vente</button><button class="btn sm" data-a="back" data-id="${m.id}">Retour</button></div>`
      : `<span class="badge ok">Soldée</span><small>${det}</small>`;
  };
  return `<table><thead><tr><th>Date</th><th>Produit</th><th class="num">Qté</th><th class="num">Prix unitaire</th>${acts ? '<th>Statut</th><th></th>' : ''}</tr></thead><tbody>${list.map(m => {
    const p = prod(m.pid); return `<tr><td>${dateFr(m.date)}</td><td>${esc(p ? p.name : 'Produit supprimé')}<small>${esc(m.note || '')}</small></td>

}
function vMoves() {

function moveForm(type, pid) {
  if (!db.products.length) return toast('Ajoutez d’abord un produit');
  const isIn = type === 'in', first = prod(pid) || db.products[0];
  open(`<form method="dialog" id="mf"><h2>${isIn ? 'Entrée en stock' : 'Sortie de stock'}</h2>
  <label class="f">Produit<select name="pid">${db.products.map(p => `<option value="${p.id}" ${p.id === first.id ? 'selected' : ''}>${esc(p.name)} (stock : ${p.stock})</option>`).join('')}</select></label>

  ${field(isIn ? 'Prix d’achat unitaire (FCFA)' : 'Prix de vente unitaire (FCFA)', 'unit', isIn ? first.cost : first.price, 'type="number" min="0" step="any" required')}
  ${field('Note (n° de facture, client, motif…)', 'note', '', 'maxlength="120"')}
  <p class="hint" id="mh">${isIn ? 'Le prix fournisseur du produit sera mis à jour avec ce prix.' : ''}</p>
  <div class="foot"><button type="button" class="btn" data-close>Annuler</button><button class="btn pri">Enregistrer</button></div></form>`);
  const f = $('#mf');

}

/* ---------- Ventes ---------- */
function saleNo(n) { return 'V-' + String(n).padStart(4, '0'); }
function descOf(p) { return p.desc || [p.brand, p.cat, p.size && p.size + ' ml'].filter(Boolean).join(' · '); }
function dsc(l) { if (!l.list || l.unit === l.list) return ''; const p = Math.round((l.unit - l.list) / l.list * 100); return p ? `<span class="dsc ${p < 0 ? 'neg' : 'pos'}">${p > 0 ? '+' : ''}${p} %</span>` : ''; }
const saleQty = s => s.lines.reduce((a, l) => a + l.qty, 0);
const saleRem = s => s.lines.reduce((a, l) => a + l.qty * (l.list - l.unit), 0);
function inPeriod(d) {
  const t = today(); if (sper === 'all') return true; if (sper === 'day') return d === t;
  if (sper === 'week') { const x = new Date(); x.setDate(x.getDate() - 6); return d >= x.toISOString().slice(0, 10); }
  return d.startsWith(t.slice(0, 7));
}
function vSales() {
  const list = db.sales.filter(s => inPeriod(s.date)).sort((a, b) => b.date.localeCompare(a.date) || b.n - a.n);
  const ca = list.reduce((s, x) => s + x.total, 0), qv = list.reduce((s, x) => s + saleQty(x), 0), rem = list.reduce((s, x) => s + saleRem(x), 0), dc = db.cash.filter(c => c.src !== 'capital' && inPeriod(c.date)).reduce((s, c) => s + c.amount, 0);
  const P = [['day', 'Aujourd’hui'], ['week', '7 derniers jours'], ['month', 'Ce mois'], ['all', 'Tout']];
  return `<div class="bar"><select id="sper" aria-label="Période">${P.map(([v, l]) => `<option value="${v}" ${v === sper ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
  <div class="kpis"><div class="kpi hero"><span>Montant total des ventes</span><b>${fcfa(ca)}</b></div><div class="kpi"><span>Quantité vendue</span><b>${qv}</b></div>
  <div class="kpi"><span>Nombre de ventes</span><b>${list.length}</b></div><div class="kpi"><span>Remises accordées</span><b>${fcfa(rem)}</b></div>
  <div class="kpi"><span>Décaissements</span><b>${fcfa(dc)}</b></div><div class="kpi"><span>Solde après décaissements</span><b>${fcfa(ca - dc)}</b></div></div>
  <div class="card">${list.length ? `<table><thead><tr><th>N°</th><th>Date</th><th>Client</th><th>Articles vendus</th><th class="num">Qté</th><th class="num">Total</th><th></th></tr></thead><tbody>
  ${list.map(s => `<tr><td><b>${saleNo(s.n)}</b></td><td>${dateFr(s.date)}</td><td>${esc(s.client || '—')}</td>
  <td>${s.lines.map(l => `<div class="art">${l.qty} × <b>${esc(l.name)}</b>${dsc(l)}<small>${esc(l.desc)}</small><small>${fcfa(l.unit)} l’unité${l.unit !== l.list ? ` · prix initial <s>${fcfa(l.list)}</s>` : ''}</small></div>`).join('')}</td>
  <td class="num">${saleQty(s)}</td><td class="num"><b>${fcfa(s.total)}</b></td>
  <td><div class="acts"><button class="btn sm" data-a="receipt" data-id="${s.id}">Reçu</button><button class="btn sm bad" data-a="unsale" data-id="${s.id}">Annuler</button></div></td></tr>`).join('')}</tbody></table>`
    : '<p class="empty">Aucune vente sur cette période. Cliquez sur « Nouvelle vente » pour en enregistrer une.</p>'}</div>`;
}
function saleForm(pid) {
  const avail = db.products.filter(p => p.stock > 0);
  if (!avail.length) return toast('Aucun produit en stock à vendre');
  dlg.classList.add('wide'); dlg.addEventListener('close', () => dlg.classList.remove('wide'), { once: true });
  const opts = avail.map(p => `<option value="${p.id}">${esc(p.name)}${p.size ? ' ' + p.size + ' ml' : ''} (stock ${p.stock})</option>`).join('');
  open(`<form method="dialog" id="sf"><h2>Nouvelle vente</h2>
  <div class="row">${field('Date', 'date', today(), 'type="date" required')}${field('Client (facultatif)', 'client', '', 'maxlength="80"')}</div>
  <div class="sl slh"><span>Produit</span><span>Qté</span><span class="r">Prix initial</span><span>Prix négocié</span><span class="r">Total</span><span></span></div>
  <div id="lines"></div><div><button type="button" class="btn sm" id="addl">+ Ajouter un article</button></div>
  <div class="tot"><div><span>Remise négociée</span><b id="rem">0 FCFA</b></div><div><span>Total à encaisser</span><b id="tot">0 FCFA</b></div></div>
  <p class="hint" id="sh"></p>
  <div class="foot"><button type="button" class="btn" data-close>Annuler</button><button class="btn pri">Enregistrer la vente</button></div></form>`);
  const f = $('#sf'), box = $('#lines'), q = (r, n) => r.querySelector(`[name=${n}]`);
  const calc = () => {
    let tot = 0, rem = 0;
    box.querySelectorAll('.sl').forEach(r => {
      const p = prod(q(r, 'p').value), n = parseInt(q(r, 'q').value, 10) || 0, u = +q(r, 'u').value || 0, pc = p.price ? Math.round((u - p.price) / p.price * 100) : 0;
      r.querySelector('.lp').textContent = fcfa(p.price);
      r.querySelector('.lt').innerHTML = fcfa(n * u) + (pc ? `<span class="dsc ${pc < 0 ? 'neg' : 'pos'}">${pc > 0 ? '+' : ''}${pc} %</span>` : '');
      tot += n * u; rem += n * (p.price - u);
    });
    $('#tot').textContent = fcfa(tot); $('#rem').textContent = fcfa(rem);
  };
  const sync = (r, reset) => { const p = prod(q(r, 'p').value); if (reset || r.dataset.p !== p.id) { q(r, 'u').value = p.price; r.dataset.p = p.id; } q(r, 'q').max = p.stock; calc(); };
  const add = id => {
    box.insertAdjacentHTML('beforeend', `<div class="sl"><select name="p" aria-label="Produit">${opts}</select><input name="q" type="number" min="1" step="1" value="1" required aria-label="Quantité"><span class="lp r"></span><input name="u" type="number" min="0" step="any" required aria-label="Prix négocié"><b class="lt r"></b><button type="button" class="btn sm bad" data-rm aria-label="Retirer l’article">✕</button></div>`);
    const r = box.lastElementChild; q(r, 'p').value = id; sync(r, true);
  };
  add(avail.some(p => p.id === pid) ? pid : avail[0].id);
  $('#addl').onclick = () => add(avail[0].id);
  box.onclick = e => { const b = e.target.closest('[data-rm]'); if (b && box.children.length > 1) { b.closest('.sl').remove(); calc(); } };
  box.oninput = calc;
  box.onchange = e => { if (e.target.name === 'p') sync(e.target.closest('.sl')); };
  f.onsubmit = e => {
    e.preventDefault();
    const L = [...box.querySelectorAll('.sl')].map(r => ({ p: prod(q(r, 'p').value), n: parseInt(q(r, 'q').value, 10), u: +q(r, 'u').value }));
    const used = {}; L.forEach(l => used[l.p.id] = (used[l.p.id] || 0) + l.n);
    const bad = Object.keys(used).map(id => prod(id)).find(p => used[p.id] > p.stock);
    if (bad) { const h = $('#sh'); h.textContent = `Stock insuffisant pour « ${bad.name} » : il reste ${bad.stock} unité(s).`; h.style.color = 'var(--bad)'; return; }
    const date = f.elements.date.value, client = f.elements.client.value.trim();
    const sale = { id: uid(), n: db.sales.reduce((m, s) => Math.max(m, s.n), 0) + 1, ts: Date.now(), date, client, lines: [], total: 0 };
    L.forEach(l => {
      l.p.stock -= l.n; sale.total += l.n * l.u;
      sale.lines.push({ pid: l.p.id, name: l.p.name, desc: descOf(l.p), qty: l.n, list: l.p.price, unit: l.u });
      db.moves.push({ id: uid(), ts: Date.now(), pid: l.p.id, type: 'out', qty: l.n, unit: l.u, date, note: `Vente ${saleNo(sale.n)}${client ? ' · ' + client : ''}`, sale: sale.id });
    });
    db.sales.push(sale); save(); dlg.close(); render(); toast('Vente enregistrée'); receiptForm(sale.id);
  };
}
function receiptData(s) {

/* ---------- Sorties : vente confirmée ou retour ---------- */

/* ---------- Suppression d'un mouvement (mot de passe requis) ---------- */
function moveBlock(m) {
  const p = prod(m.pid);
  if (m.sale) return 'Ce mouvement appartient à une vente : annulez la vente depuis la page Ventes.';
  if (m.type === 'out' && ((m.sold || 0) > 0 || (m.ret || 0) > 0)) return 'Cette sortie a déjà des ventes ou des retours liés. Annulez d’abord la vente concernée, ou supprimez d’abord le retour.';
  if ((m.type === 'in' || m.type === 'ret') && p && p.stock < m.qty) return `Suppression impossible : il ne reste que ${p.stock} unité(s) en stock pour « ${p.name} », alors que ce mouvement en a ajouté ${m.qty} (elles ont déjà été sorties).`;
  return '';
}
function removeMove(m) {
  const p = prod(m.pid);
  if (p) p.stock += m.type === 'out' ? m.qty : -m.qty;
  if (m.type === 'ret') { const o = db.moves.find(x => x.id === m.from); if (o) o.ret = Math.max(0, (o.ret || 0) - m.qty); }
  if (m.order) { const o = db.orders.find(x => x.id === m.order), l = o && o.lines.find(x => x.id === m.ol); if (l) l.recv = Math.max(0, (l.recv || 0) - m.qty); }
  db.moves = db.moves.filter(x => x !== m);
}
async function verifyPass(pw) {
  try {
    const r = await fetch('/api/data?backups=1', { cache: 'no-store', headers: { 'x-app-password': pw } });
    if (r.status === 200) return true;
    if (r.status === 401) return false;
  } catch (e) {}
  return pw === pass; // serveur injoignable : comparaison avec le mot de passe de la session
}
function delMove(id) {
  const m = db.moves.find(x => x.id === id); if (!m) return;
  if (cloud === 'local') return alert('La suppression demande le mot de passe du serveur : indisponible en mode local.');
  const why = moveBlock(m); if (why) return alert(why);
  const p = prod(m.pid), delta = m.type === 'out' ? '+' : '−', kind = { in: 'Entrée', out: 'Sortie', ret: 'Retour' }[m.type];
  open(`<form method="dialog" id="df"><h2>Supprimer ce mouvement</h2>
  <p class="hint">${kind} de ${m.qty} × <b>${esc(p ? p.name : 'produit supprimé')}</b> du ${dateFr(m.date)}.${p ? ` Le stock sera corrigé de ${delta}${m.qty} (${p.stock} → ${p.stock + (m.type === 'out' ? m.qty : -m.qty)}).` : ''} Cette action est définitive.</p>
  ${field('Mot de passe', 'pw', '', 'type="password" required autocomplete="current-password"')}<p class="hint" id="dh"></p>
  <div class="foot"><button type="button" class="btn" data-close>Annuler</button><button class="btn pri" id="dok">Supprimer</button></div></form>`);
  $('#df').onsubmit = async e => {
    e.preventDefault();
    const b = $('#dok'), h = $('#dh'); b.disabled = true; h.style.color = 'var(--mute)'; h.textContent = 'Vérification…';
    const ok = await verifyPass(new FormData(e.target).get('pw'));
    b.disabled = false;
    if (!ok) { h.style.color = 'var(--bad)'; h.textContent = 'Mot de passe incorrect.'; return; }
    const cur = db.moves.find(x => x.id === id), again = cur && moveBlock(cur);
    dlg.close();
    if (!cur) return;

  };
}

/* ---------- Commandes fournisseurs ---------- */

const lineRest = l => l.qty - (l.recv || 0);

/* ---------- Synchronisation cloud (Vercel + Redis) ---------- */
const PW = 'planete2.pw';
let pass = sessionStorage.getItem(PW) || '', rev = 0, cloud = 'sync', why = '', dirty = false, pushing = false, again = false;
const cache = () => { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (_) {} };
const reason = (st, j) => st === 404 ? 'API introuvable : fichier api/data.js absent' : st === 500 ? 'Erreur serveur' + (j.detail ? ' (' + j.detail + ')' : '') : 'Erreur ' + st;
async function api(method, body, qs = '') {
  const r = await fetch('/api/data' + qs, { method, cache: 'no-store', headers: { 'Content-Type': 'application/json', 'x-app-password': pass }, body: body ? JSON.stringify(body) : undefined });
  let j = {}; try { j = await r.json(); } catch (_) {}
  return { status: r.status, j };
}
function setLink() {
  const M = { ok: ['Synchronisé', 'Données partagées sur tous vos appareils'], sync: ['Synchronisation…', 'Un instant'], offline: ['Hors connexion', (why || 'Serveur injoignable') + ' · modifications gardées ici'], local: ['Mode local', 'Serveur non configuré : données de ce navigateur seulement'] }[cloud];
  const el = $('#link'); el.className = 'link ' + cloud; el.querySelector('b').textContent = M[0]; el.querySelector('small').textContent = M[1];
}
function login(msg) {
  open(`<form method="dialog" id="lf"><h2>Planète 2</h2><p class="hint">${esc(msg || 'Entrez le mot de passe pour accéder au stock.')}</p>${field('Mot de passe', 'pw', '', 'type="password" required autocomplete="current-password"')}<div class="foot"><button class="btn pri">Entrer</button></div></form>`);
  dlg.oncancel = e => e.preventDefault();
  $('#lf').onsubmit = e => { pass = new FormData(e.target).get('pw'); sessionStorage.setItem(PW, pass); dlg.oncancel = null; pull(true); };
}
async function pull(first) {
  try {
    const { status, j } = await api('GET');
    if (status === 401) { pass = ''; sessionStorage.removeItem(PW); return login('Mot de passe incorrect'); }
    if (status === 503) { cloud = 'local'; if (j.error === 'password') toast('Variable APP_PASSWORD manquante sur Vercel'); return setLink(); }
    if (status !== 200) { why = reason(status, j); throw new Error('http'); }
    cloud = 'ok'; why = '';
    if (first && j.rev === 0 && db.products.length) { dirty = true; setLink(); return push(); } // reprise des données déjà saisies sur ce navigateur
    if (first || (j.rev !== rev && !dirty)) { db = norm(j.db); rev = j.rev; cache(); render(); }
  } catch (e) { cloud = 'offline'; if (e.message !== 'http') why = 'Réseau injoignable'; }
  setLink();
}
async function push() {
  if (cloud === 'local') return;
  if (pushing) { again = true; return; }
  pushing = true; cloud = 'sync'; setLink();
  try {
    const { status, j } = await api('PUT', { rev, db });
    if (status === 200) { rev = j.rev; dirty = false; cloud = 'ok'; }
    else if (status === 409) { db = norm(j.db); rev = j.rev; dirty = false; cloud = 'ok'; cache(); render(); toast('Modifié depuis un autre appareil : version à jour rechargée, refaites votre dernière saisie'); }
    else if (status === 401) { pass = ''; sessionStorage.removeItem(PW); login('Session expirée'); }
    else { why = reason(status, j); throw new Error('http'); }
  } catch (e) { cloud = 'offline'; dirty = true; if (e.message !== 'http') why = 'Réseau injoignable'; }
  pushing = false; setLink();
  if (again) { again = false; push(); }
}
const sumTxt = d => `${d.products.length} produit(s) · ${d.moves.length} mouvement(s) · stock ${fcfa(d.products.reduce((s, p) => s + p.stock * p.cost, 0))} (achat)`;

  if (cloud === 'local' || cloud === 'offline') return toast('Les sauvegardes datées demandent une connexion au serveur');

  if (!ids.length) return toast('Aucune sauvegarde pour l’instant : la première est créée à la prochaine modification');

      $('#sum').innerHTML = `<b>Cette sauvegarde</b> : ${esc(sumTxt(r.j.db))}<br><b>Actuellement</b> : ${esc(sumTxt(db))}`; $('#rb').disabled = false; }

}

const idle = () => !dlg.open && !pushing && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName);
setInterval(() => { if (!pass || cloud === 'local') return; if (dirty) push(); else if (idle()) pull(false); }, 15000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && pass && cloud !== 'local' && !dirty && idle()) pull(false); });
addEventListener('online', () => pass && cloud !== 'local' && (dirty ? push() : pull(false)));

/* ---------- Événements ---------- */
document.addEventListener('click', e => {
  if (e.target.closest('[data-close]')) return dlg.close();
  const nav = e.target.closest('#nav button'); if (nav) { view = nav.dataset.view; return render(); }
  const b = e.target.closest('[data-a]'); if (!b) return;
  const p = prod(b.dataset.id);
  ({ new: () => productForm(), cash: () => cashForm(), cap: () => capForm(), delcap: () => delCap(b.dataset.id), order: () => orderForm(), recv: () => receiveForm(b.dataset.id), cancelord: () => cancelOrder(b.dataset.id), delcash: () => delCash(b.dataset.id), exp: exportForm, sale: () => saleForm(b.dataset.id), receipt: () => receiptForm(b.dataset.id), unsale: () => cancelSale(b.dataset.id), edit: () => productForm(p), in: () => moveForm('in', b.dataset.id), out: () => exitForm(b.dataset.id), back: () => backForm(b.dataset.id), sellout: () => saleFromExit(b.dataset.id), delmove: () => delMove(b.dataset.id), demo,
    del: () => { if (confirm(`Supprimer « ${p.name} » et son historique ?`)) { db.products = db.products.filter(x => x !== p); db.moves = db.moves.filter(m => m.pid !== p.id); save(); render(); toast('Produit supprimé'); } } })[b.dataset.a]();
});
document.addEventListener('input', e => { if (e.target.id === 'q') { q = e.target.value; const pos = e.target.selectionStart; render(); const i = $('#q'); i.focus(); i.setSelectionRange(pos, pos); } });
document.addEventListener('change', e => { if (e.target.id === 'fcat') { fcat = e.target.value; render(); } if (e.target.id === 'ftype') { ftype = e.target.value; render(); } if (e.target.id === 'sper') { sper = e.target.value; render(); } if (e.target.id === 'ofilt') { ofilt = e.target.value; render(); } });
$('#export').onclick = () => {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' }));
  a.download = `planete2-stock-${today()}.json`; a.click(); URL.revokeObjectURL(a.href);
};
$('#import').onchange = async e => {
  try {
    const d = JSON.parse(await e.target.files[0].text());
    if (!Array.isArray(d.products) || !Array.isArray(d.moves)) throw 0;
    if (confirm('Remplacer toutes les données actuelles par ce fichier ?')) { db = norm(d); save(); render(); toast('Données importées'); }
  } catch (_) { toast('Fichier invalide'); }
  e.target.value = '';
};
$('#backups').onclick = backupsForm;
$('#logout').onclick = () => { sessionStorage.removeItem(PW); location.reload(); };
setLink();
render();
if (location.protocol === 'file:') { cloud = 'local'; setLink(); } else if (pass) pull(true); else login();

</script>
</body>
</html>
